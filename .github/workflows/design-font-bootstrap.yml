# Temporary branch-only dependency resolution. No repository write permission.
name: Newsreader dependency resolution
on:
  push:
    branches: [feat/design-tokens]
    paths:
      - ".github/workflows/design-font-bootstrap.yml"
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1
        with:
          install: false
      - name: Resolve licensed variable font
        run: pnpm --filter @fibli/tokens add --save-exact --lockfile-only --ignore-scripts --no-frozen-lockfile @fontsource-variable/newsreader@5.3.0
      - name: Return dependency delta
        run: git diff -- packages/tokens/package.json pnpm-lock.yaml
      - name: Verify install and source stylesheet
        run: |
          pnpm install --frozen-lockfile
          cd packages/tokens/node_modules/@fontsource-variable/newsreader
          ls *.css
          head -n 16 standard.css
          head -n 16 standard-italic.css
          head -n 5 LICENSE
